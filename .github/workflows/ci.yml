# The org homepage: PR checks, and a live build from every repo's .github/homepage.json that
# deploys to Pages. One file, from hashira's static-webapp template.
#
# Triggers:
#   - pull_request          : hashira's static-webapp CI only (tests with coverage, the scan
#                             suite, SoMi's quality gate, and an offline build from the test
#                             fixture with no token and no network), so a PR can never reach
#                             the org.
#   - push to main          : a change to the homepage itself.
#   - schedule (hourly)     : picks up new repos, releases, manifest edits and open PRs without a ping.
#   - repository_dispatch   : `project-released` (after a release) or `project-updated` (after a
#                             manifest or image change), sent by a project repo so its tile
#                             updates within minutes. Both only mean "rebuild".
#   - workflow_dispatch     : by hand.
#
# Every trigger but pull_request runs the live build and deploys. hashira's CI job does not
# run there: it always uploads its fixture build as the Pages artifact, and its reusable
# workflow takes no secrets, while the live build needs one. The live build is this repo's
# own `build` job, with hashira's site-kit, pages-upload and pages-deploy actions. The PR's
# fixture build gets the same kit (site_kit), and its job holds no Pages or OIDC grant.
#
# The merge is the approval: main only takes reviewed pull requests (or an owner), so every
# trigger builds and deploys main with no second, manual approval. The github-pages Environment
# accepts deployments from main only.
# The dispatch payload is never read: the build always reads the repos itself, so a ping can
# only make the homepage rebuild sooner, not change what it shows.
#
# Token: the build reads the org with HOMEPAGE_READ_TOKEN when that secret is set (a fine-grained
# token with read-only Contents and Metadata on all skathio repos; needed only to list private
# repos that opted in). Without it, the job's own token lists public repos only.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [project-released, project-updated]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    if: github.event_name == 'pull_request'
    # The job id `ci` names the required check `ci / passed`; keep it. All four hashira refs
    # (this one and the build job's three actions) track the moving v3 tag, so v3.x
    # releases apply with no PR here. Move them to v4 together.
    uses: skathio/hashira/.github/workflows/static-webapp-ci.yml@v3
    permissions:
      contents: read # check out the repository
      pull-requests: write # the passed job keeps one CI summary comment on the pull request
      security-events: write # upload CodeQL results when CodeQL is enabled
    with:
      node_version: '24'
      build_command: 'npm run build:fixture'
      output_dir: 'dist'
      # The kit goes into the PR's artifact too, so it renders the nav the deploy serves.
      site_kit: true

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # pages-upload (upload-pages-artifact)
      pages: write      # pages-upload (upload-pages-artifact)
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build from the org's repos
        env:
          GH_TOKEN: ${{ secrets.HOMEPAGE_READ_TOKEN || github.token }}
        run: npm run build
      # The kit behind every page's <site-nav> (tokens.css, theme.js, site-nav.js) goes into
      # dist/_kit/, at the hashira commit the v3 tag resolves to. Same tag as the ci job above.
      - uses: skathio/hashira/.github/actions/site-kit@v3
        with:
          dest: dist
      # Same hashira tag as the ci job above.
      - uses: skathio/hashira/.github/actions/pages-upload@v3
        with:
          path: dist

  deploy:
    needs: build
    # Stated again, as in hashira's template, so the deploy stays off pull requests even if
    # the needs edge changes.
    if: github.event_name != 'pull_request'
    # One Pages deploy at a time; a newer run queues behind an older one instead of racing it.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write      # deploy-pages
      id-token: write   # deploy-pages authenticates via OIDC
    steps:
      # Same hashira tag as the ci job above.
      - id: deploy
        uses: skathio/hashira/.github/actions/pages-deploy@v3
