# Builds the org homepage from every repo's .github/homepage.json and deploys it to Pages.
#
# Triggers:
#   - push to main          : a change to the homepage itself.
#   - schedule (every 6 h)  : picks up new repos, releases and manifest edits without a ping.
#   - repository_dispatch   : `project-released`, sent by a project repo after a release or a
#                             manifest change, so its tile updates within minutes.
#   - workflow_dispatch     : by hand.
#
# One release, one approval: a push to main or a manual run changes what the site's own code
# does, so it waits at `gate` for the `production` Environment's owner approval. The scheduled
# rebuild and the `project-released` ping only re-read the repos' manifests, which each repo
# already ships through its own reviewed pipeline, so they run unattended; gating them would
# stall the homepage between your approvals.
# The unattended runs build the last commit you approved on main, never an unapproved tip of
# main (see the `ref` job).
# The dispatch payload is never read: the build always reads the repos itself, so a ping can
# only make the homepage rebuild sooner, not change what it shows.
#
# Token: the build reads the org with HOMEPAGE_READ_TOKEN when that secret is set (a fine-grained
# token with read-only Contents and Metadata on all skathio repos; needed only to list private
# repos that opted in). Without it, the job's own token lists public repos only.
#
# Not hashira's static-webapp-ci: that reusable workflow takes no secrets, and the build needs
# one. The upload and deploy steps are hashira's composite actions, at the same pin as the
# other skathio sites.
name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [project-released]
  workflow_dispatch:

permissions: {}


jobs:
  # One release, one approval: this job waits for the `production` Environment's owner approval.
  gate:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    permissions: {}
    steps:
      - name: Owner approval
        run: echo "Approved in the production environment."

  # Which commit to build. A push or manual run builds its own commit, once `gate` approved it. An
  # unattended refresh builds the commit of the newest run of this workflow on main whose `gate`
  # job succeeded, that is, the last commit you approved, and only if that commit is in main's
  # history. Workflow runs and their jobs cannot be created through the API, unlike deployment
  # records, so a collaborator cannot fake an approval; a rejected or pending approval never ships.
  ref:
    needs: gate
    if: ${{ !cancelled() && (needs.gate.result == 'success' || (needs.gate.result == 'skipped' && (github.event_name == 'schedule' || github.event_name == 'repository_dispatch'))) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # actions/checkout v4.2.2 — main with full history, for the ancestry check
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; then
            sha="$HEAD_SHA"
          else
            sha=""
            for row in $(gh api "repos/$REPO/actions/workflows/deploy.yml/runs?branch=main&status=success&per_page=30" \
                --jq '.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch") | "\(.id):\(.head_sha)"'); do
              gate=$(gh api "repos/$REPO/actions/runs/${row%%:*}/jobs" --jq '[.jobs[] | select(.name == "gate") | .conclusion][0] // ""')
              if [ "$gate" = success ]; then sha="${row#*:}"; break; fi
            done
            if [ -z "$sha" ]; then
              echo "::error::No approved run of this workflow on main yet. Approve a push or a manual run first."
              exit 1
            fi
          fi
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::not a commit SHA: $sha"; exit 1; fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then echo "::error::$sha is not in main's history"; exit 1; fi
          echo "Building $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: ref
    if: ${{ !cancelled() && needs.ref.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # pages-upload (upload-pages-artifact)
      pages: write      # pages-upload (upload-pages-artifact)
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ needs.ref.outputs.sha }}
          persist-credentials: false
      # actions/setup-node (same pin as hashira's flows)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Build from the org's repos
        env:
          GH_TOKEN: ${{ secrets.HOMEPAGE_READ_TOKEN || github.token }}
        run: npm run build
      - uses: skathio/hashira/.github/actions/pages-upload@e4facc4ca8d8896285931a3b80a1a958584d1a85
        with:
          path: dist

  deploy:
    needs: build
    # One Pages deploy at a time. On this job only, so a run waiting at `gate` never holds the
    # queue for the others.
    concurrency:
      group: pages
      cancel-in-progress: false
    # `!cancelled()` because a skipped `gate` upstream would otherwise skip this job too; unlike
    # `always()` it still stops on a cancelled run.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write      # deploy-pages
      id-token: write   # deploy-pages authenticates via OIDC
    steps:
      - id: deploy
        uses: skathio/hashira/.github/actions/pages-deploy@e4facc4ca8d8896285931a3b80a1a958584d1a85
